<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor">
    <style>
        circle {
            stroke-width: 2;
            stroke-dasharray: 0.33 0.66;
            opacity: 0.33;
            transform-origin: 50% 50%;
            animation: spin 1.6s linear infinite;
        }
        circle:nth-of-type(2) { animation-timing-function: cubic-bezier(0.5, 0, 1, 1); }
        circle:nth-of-type(3) { animation-timing-function: cubic-bezier(0.85, 0, 1, 1); }
        @keyframes spin {
            from { transform: rotate(-90deg); }
            to { transform: rotate(270deg); }
        }
    </style>
    <circle cx="12" cy="12" r="10" pathLength="1"/>
    <circle cx="12" cy="12" r="10" pathLength="1"/>
    <circle cx="12" cy="12" r="10" pathLength="1"/>
</svg>