<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160" role="img" aria-label="Animated bus">
    <defs>
        <style>
            .bus-bob {
            transform-origin: 160px 92px;
            animation: bob 1.2s ease-in-out infinite;
            }
            @keyframes bob {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(4px); }
            }
        </style>
    </defs>

    <!-- ground shadow -->
    <ellipse cx="160" cy="134" rx="120" ry="12" fill="rgba(0,0,0,0.15)"/>

    <g class="bus-bob">
        <!-- main body -->
        <rect x="52" y="54" width="216" height="64" rx="18" fill="#2e3a46"/>

        <!-- windows: rounded squares array -->
        <g fill="#a9d7e6" opacity="0.95">
            <rect x="78"  y="66" width="22" height="22" rx="7"/>
            <rect x="106" y="66" width="22" height="22" rx="7"/>
            <rect x="134" y="66" width="22" height="22" rx="7"/>
            <rect x="162" y="66" width="22" height="22" rx="7"/>
        </g>

        <!-- windshield: tall, near right edge -->
        <rect x="244" y="62" width="18" height="44" rx="8" fill="#a9d7e6" opacity="0.95"/>
        <rect x="248" y="68" width="10" height="14" rx="5" fill="#ffffff" opacity="0.22"/>

        <!-- bumper -->
        <rect x="56" y="112" width="208" height="10" rx="5" fill="#1b222a" opacity="0.9"/>

        <!-- headlight (front/right) -->
        <rect x="262" y="88" width="10" height="10" rx="4" fill="#ffd27a"/>

        <!-- taillight (rear/left) -->
        <rect x="56" y="84" width="10" height="14" rx="4" fill="#ff5a6a"/>
        <rect x="58" y="86" width="6" height="10" rx="3" fill="#ffd27a" opacity="0.45"/>

        <!-- wheel 1 -->
        <g>
            <g>
                <animateTransform
                        attributeName="transform"
                        type="rotate"
                        from="0 106 122"
                        to="360 106 122"
                        dur="0.9s"
                        repeatCount="indefinite"/>
                <circle cx="106" cy="122" r="18" fill="#12161b"/>
                <circle cx="106" cy="122" r="10" fill="#2e3a46"/>

                <!-- 8 small bolts -->
                <g fill="#a9d7e6" opacity="0.9">
                    <circle cx="106" cy="109" r="1.5"/>
                    <circle cx="115" cy="113" r="1.5"/>
                    <circle cx="119" cy="122" r="1.5"/>
                    <circle cx="115" cy="131" r="1.5"/>
                    <circle cx="106" cy="135" r="1.5"/>
                    <circle cx="97"  cy="131" r="1.5"/>
                    <circle cx="93"  cy="122" r="1.5"/>
                    <circle cx="97"  cy="113" r="1.5"/>
                </g>
            </g>
        </g>

        <!-- wheel 2 -->
        <g>
            <g>
                <animateTransform
                        attributeName="transform"
                        type="rotate"
                        from="0 230 122"
                        to="360 230 122"
                        dur="0.9s"
                        repeatCount="indefinite"/>
                <circle cx="230" cy="122" r="18" fill="#12161b"/>
                <circle cx="230" cy="122" r="10" fill="#2e3a46"/>

                <!-- 8 small bolts -->
                <g fill="#a9d7e6" opacity="0.9">
                    <circle cx="230" cy="109" r="1.5"/>
                    <circle cx="239" cy="113" r="1.5"/>
                    <circle cx="243" cy="122" r="1.5"/>
                    <circle cx="239" cy="131" r="1.5"/>
                    <circle cx="230" cy="135" r="1.5"/>
                    <circle cx="221" cy="131" r="1.5"/>
                    <circle cx="217" cy="122" r="1.5"/>
                    <circle cx="221" cy="113" r="1.5"/>
                </g>
            </g>
        </g>
    </g>
</svg>