<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor">
    <style>
        circle {
        stroke-width: 2;
        stroke-dasharray: 0.5 0.5;
        opacity: 0.33;
        transform-origin: 50% 50%;
        animation: spin 3.2s linear infinite;
        }
        @keyframes spin {
        from { transform: rotate(-90deg); }
        to { transform: rotate(270deg); }
        }
    </style>
    <circle cx="12" cy="12" r="10" pathLength="3"/>
    <circle cx="12" cy="12" r="6.6" pathLength="2"/>
    <circle cx="12" cy="12" r="3.3" pathLength="1"/>
</svg>